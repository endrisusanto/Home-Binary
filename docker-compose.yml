services:
  homebinary-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: build-homebinary-web
    restart: unless-stopped
    ports:
      - "14300:14300"
    volumes:
      - ./engine/auth:/app/engine/auth
    environment:
      - PORT=14300
      - NODE_ENV=production
      - PUBLIC_URL=https://homebinary.endrisusanto.my.id
